name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}

          script: |
            set -e

            cd ~/apps/Retailedge-Pro

            git pull origin main

            echo "Installing backend..."
            cd backend
            npm ci
            NODE_ENV=production pm2 restart quizhive-api --update-env || NODE_ENV=production pm2 start server.js --name quizhive-api

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deploying frontend..."
            sudo rm -rf /var/www/retailedge/*
            sudo cp -r dist/* /var/www/retailedge/
            sudo chown -R www-data:www-data /var/www/retailedge

            echo "Ensuring Nginx WebSocket /socket.io proxy is configured..."
            NGINX_CONF=$(grep -l "location /api" /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null | head -n 1)
            if [ -n "$NGINX_CONF" ]; then
              if ! grep -q "location /socket.io" "$NGINX_CONF"; then
                echo "Adding /socket.io proxy to $NGINX_CONF..."
                sudo sed -i '/location \/api/i \
    location /socket.io/ {\
        proxy_pass http://localhost:5000;\
        proxy_http_version 1.1;\
        proxy_set_header Upgrade $http_upgrade;\
        proxy_set_header Connection "Upgrade";\
        proxy_set_header Host $host;\
        proxy_cache_bypass $http_upgrade;\
    }\
    location /uploads/ {\
        proxy_pass http://localhost:5000;\
        proxy_set_header Host $host;\
    }' "$NGINX_CONF"
              fi
            fi

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
