name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}

          script: |
            set -e

            cd ~/apps/Retailedge-Pro

            git pull origin main

            echo "Installing backend..."
            cd backend
            npm ci
            NODE_ENV=production pm2 restart quizhive-api --update-env || NODE_ENV=production pm2 start server.js --name quizhive-api

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deploying frontend..."
            sudo rm -rf /var/www/retailedge/*
            sudo cp -r dist/* /var/www/retailedge/
            sudo chown -R www-data:www-data /var/www/retailedge

            echo "Ensuring Nginx WebSocket /socket.io proxy is configured..."
            python3 -c '
import os, sys
conf_files = ["/etc/nginx/sites-available/default", "/etc/nginx/sites-enabled/default", "/etc/nginx/conf.d/default.conf"]
target_file = None
for cf in conf_files:
    if os.path.exists(cf):
        with open(cf, "r") as f:
            if "location /api" in f.read():
                target_file = cf
                break

if target_file:
    with open(target_file, "r") as f:
        content = f.read()
    if "/socket.io" not in content:
        socket_block = """
    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
    }
"""
        new_content = content.replace("location /api", socket_block + "\n    location /api", 1)
        with open("/tmp/nginx_updated.conf", "w") as f:
            f.write(new_content)
        os.system(f"sudo mv /tmp/nginx_updated.conf {target_file}")
        print(f"Updated Nginx config at {target_file}")
'

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
