name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e

            cd ~/apps/Retailedge-Pro

            git checkout -- .
            git pull origin main

            echo "Installing backend dependencies..."
            cd backend
            npm ci

            echo "Executing database migration gate & schema verification..."
            node scripts/deploy_migration_gate.js

            echo "Restarting backend service..."
            NODE_ENV=production pm2 restart quizhive-api --update-env || NODE_ENV=production pm2 start server.js --name quizhive-api
            sudo python3 configure_nginx.py

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Deploying frontend..."
            sudo rm -rf /var/www/retailedge/*
            sudo cp -r dist/* /var/www/retailedge/
            sudo chown -R www-data:www-data /var/www/retailedge

            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "Validating local application health..."
            curl -f -s http://localhost:5000/api/health || (echo "Health check failed!" && exit 1)

            echo "Deployment completed successfully!"
