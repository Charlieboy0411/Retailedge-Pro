name: QuizHive Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quizhive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # ─── FRONTEND BUILD & TEST ───
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend Application
      run: |
        cd frontend
        npm run build

    # ─── BACKEND LINT, UNIT & INTEGRATION TESTS ───
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Backend Linter
      run: |
        cd backend
        npm run lint --if-present

    - name: Execute Database Migrations for Testing
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: quizhive_test
        DB_USER: postgres
        DB_PASS: password123
        NODE_ENV: test
      run: |
        cd backend
        npm run migrate --if-present

    - name: Run Backend Unit Tests with Coverage
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: quizhive_test
        DB_USER: postgres
        DB_PASS: password123
        NODE_ENV: test
      run: |
        cd backend
        npm run test:unit --if-present

    - name: Run Backend Integration Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: quizhive_test
        DB_USER: postgres
        DB_PASS: password123
        NODE_ENV: test
      run: |
        cd backend
        npm run test:integration --if-present

    - name: Run API Contract & Regression Verification
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: quizhive_test
        DB_USER: postgres
        DB_PASS: password123
        NODE_ENV: test
      run: |
        cd backend
        node tests/verify_intelligence.js
        node tests/verify_report_data_lineage.js
        node tests/verify_reports_analytics_engine.js
        node tests/verify_uat_remediation_suite.js
        node tests/verify_td_data_hardening.js
        node tests/verify_reporting_data_integrity.js

    # ─── PERFORMANCE & LOAD BENCHMARK (OPTIONAL / NON-BLOCKING) ───
    - name: Run WebSocket & API Benchmark
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: quizhive_test
        DB_USER: postgres
        DB_PASS: password123
        NODE_ENV: test
      run: |
        cd backend
        # Start server in the background
        npm start &
        # Wait for port 5000 to be active
        npx wait-on http://localhost:5000/api/admin/stats --timeout 15000
        # Run benchmark
        npm run benchmark

    # ─── UPLOAD TEST COVERAGE REPORT ───
    - name: Upload coverage reports to Codecov
      uses: actions/upload-artifact@v4
      with:
        name: jest-coverage-report
        path: backend/coverage/

  deploy:
    name: Deploy to Production EC2
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e

            TARGET_SHA="${{ github.sha }}"
            echo "Starting production deployment for exact commit: $TARGET_SHA"

            cd ~/apps/Retailedge-Pro

            # Preserve state and checkout exact commit SHA
            sudo mkdir -p /var/www/retailedge_state /var/www/retailedge_releases
            sudo chmod 755 /var/www/retailedge_state /var/www/retailedge_releases

            PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "$PREV_SHA" | sudo tee /var/www/retailedge_state/previous_backend_sha > /dev/null
            echo "Previous backend SHA recorded: $PREV_SHA"

            git checkout -- .
            git fetch origin main
            git checkout "$TARGET_SHA"
            CURRENT_CHECKOUT=$(git rev-parse HEAD)
            if [ "$CURRENT_CHECKOUT" != "$TARGET_SHA" ]; then
              echo "CRITICAL: Git checkout failed to match target SHA $TARGET_SHA (current: $CURRENT_CHECKOUT)" >&2
              exit 1
            fi
            echo "Target commit $TARGET_SHA successfully checked out."

            # Execute canonical version-controlled production deployment runner
            bash scripts/deploy_production.sh "$TARGET_SHA" "false"
